<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="300" viewBox="0 0 1050 300" role="img" aria-labelledby="t d"><title id="t">Evidence citation provenance chain</title><desc id="d">Workspace-scoped evidence document contains immutable numbered versions; each version contains chunks with content hashes and normalized byte offsets. A response revision cites chunk identifiers. The API resolves and validates those references within the same workspace and returns document, version, chunk, hash, offsets, optional section, and page metadata.</desc><rect width="1050" height="300" rx="18" fill="#0B1020"/><text x="38" y="45" fill="#E5E7EB" font-family="Arial,sans-serif" font-size="23" font-weight="700">EVIDENCE → VERSION → CHUNK → CITATION</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="38" y="105" width="205" height="100" rx="12" fill="#16213E" stroke="#3B82F6" stroke-width="2"/><text x="140" y="143" fill="#E5E7EB" font-size="17" font-weight="700">Evidence document</text><text x="140" y="171" fill="#AAB7D0" font-size="13">workspace-scoped record</text><rect x="292" y="105" width="205" height="100" rx="12" fill="#16213E" stroke="#22D3EE" stroke-width="2"/><text x="394" y="143" fill="#E5E7EB" font-size="17" font-weight="700">Immutable version</text><text x="394" y="171" fill="#AAB7D0" font-size="13">number + content hash</text><rect x="546" y="105" width="205" height="100" rx="12" fill="#16213E" stroke="#8B5CF6" stroke-width="2"/><text x="648" y="143" fill="#E5E7EB" font-size="17" font-weight="700">Evidence chunk</text><text x="648" y="171" fill="#D7CCFA" font-size="13">index + normalized offsets</text><rect x="800" y="105" width="212" height="100" rx="12" fill="#16213E" stroke="#8B5CF6" stroke-width="2"/><text x="906" y="143" fill="#E5E7EB" font-size="17" font-weight="700">Response citation</text><text x="906" y="171" fill="#D7CCFA" font-size="13">server-resolved reference</text></g><g stroke="#22D3EE" stroke-width="3"><path d="M243 155h49M497 155h49M751 155h49"/></g><g fill="#22D3EE"><path d="M284 148l12 7-12 7z"/><path d="M538 148l12 7-12 7z"/><path d="M792 148l12 7-12 7z"/></g><text x="525" y="249" fill="#AAB7D0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Citation targets are resolved by the API and must belong to the caller's authorized workspace.</text></svg>
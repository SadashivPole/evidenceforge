<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="t d"><title id="t">Local quick-start path</title><desc id="d">Prepare a safe local .env file, start the Compose services, wait for API migrations and health checks, then use the API docs or browser workbench. Run automated checks separately.</desc><rect width="1120" height="260" rx="18" fill="#0B1020"/><text x="42" y="46" fill="#E5E7EB" font-family="Arial,sans-serif" font-size="24" font-weight="700">LOCAL QUICK START · FOUR STOPS</text><g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="125" cy="129" r="31" fill="#16213E" stroke="#3B82F6" stroke-width="3"/><text x="125" y="137" fill="#E5E7EB" font-size="23" font-weight="700">1</text><text x="125" y="190" fill="#E5E7EB" font-size="16" font-weight="700">Configure</text><text x="125" y="213" fill="#AAB7D0" font-size="13">copy .env.example</text></g><g><circle cx="410" cy="129" r="31" fill="#16213E" stroke="#22D3EE" stroke-width="3"/><text x="410" y="137" fill="#E5E7EB" font-size="23" font-weight="700">2</text><text x="410" y="190" fill="#E5E7EB" font-size="16" font-weight="700">Start stack</text><text x="410" y="213" fill="#AAB7D0" font-size="13">Docker Compose</text></g><g><circle cx="700" cy="129" r="31" fill="#16213E" stroke="#8B5CF6" stroke-width="3"/><text x="700" y="137" fill="#E5E7EB" font-size="23" font-weight="700">3</text><text x="700" y="190" fill="#E5E7EB" font-size="16" font-weight="700">Check readiness</text><text x="700" y="213" fill="#AAB7D0" font-size="13">liveness + database</text></g><g><circle cx="990" cy="129" r="31" fill="#16213E" stroke="#22C55E" stroke-width="3"/><text x="990" y="137" fill="#E5E7EB" font-size="23" font-weight="700">4</text><text x="990" y="190" fill="#E5E7EB" font-size="16" font-weight="700">Explore</text><text x="990" y="213" fill="#AAB7D0" font-size="13">API docs + workbench</text></g></g><g stroke="#3B82F6" stroke-width="3"><path d="M157 129h220M442 129h220M732 129h220"/></g><g fill="#3B82F6"><path d="M369 122l12 7-12 7z"/><path d="M654 122l12 7-12 7z"/><path d="M944 122l12 7-12 7z"/></g><text x="560" y="248" fill="#AAB7D0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12">Migrations run in the API container entrypoint · no project database reset required</text></svg>
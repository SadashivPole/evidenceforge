<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="t d"><title id="t">Response idempotency and revision lifecycle</title><desc id="d">An authorized response update is validated and compared to the latest revision. An identical payload keeps the response and revision identifiers with no new revision. A changed answer or status creates a new immutable revision, with citations recorded for each revision; history returns both revisions.</desc><rect width="1100" height="330" rx="18" fill="#0B1020"/><text x="40" y="46" fill="#E5E7EB" font-family="Arial,sans-serif" font-size="24" font-weight="700">RESPONSE REVISION LIFECYCLE</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="112" width="185" height="80" rx="12" fill="#16213E" stroke="#3B82F6" stroke-width="2"/><text x="127" y="145" fill="#E5E7EB" font-size="17" font-weight="700">Authorized PUT</text><text x="127" y="169" fill="#AAB7D0" font-size="13">validate fields + citations</text><rect x="310" y="112" width="185" height="80" rx="12" fill="#16213E" stroke="#22D3EE" stroke-width="2"/><text x="402" y="145" fill="#E5E7EB" font-size="17" font-weight="700">Compare update</text><text x="402" y="169" fill="#AAB7D0" font-size="13">against current revision</text><rect x="690" y="72" width="350" height="75" rx="12" fill="#123B38" stroke="#22C55E" stroke-width="2"/><text x="865" y="103" fill="#E5E7EB" font-size="17" font-weight="700">Same content → idempotent</text><text x="865" y="127" fill="#C3F2D4" font-size="13">same IDs · no extra revision</text><rect x="690" y="205" width="350" height="75" rx="12" fill="#16213E" stroke="#8B5CF6" stroke-width="2"/><text x="865" y="236" fill="#E5E7EB" font-size="17" font-weight="700">Changed content → new revision</text><text x="865" y="260" fill="#D7CCFA" font-size="13">append-only history + revision citations</text></g><g stroke="#3B82F6" stroke-width="3" fill="none"><path d="M220 152h90M495 152h90v-42h105M585 152v90h105"/><path d="M1035 109h35v139h-30"/></g><g fill="#3B82F6"><path d="M302 145l12 7-12 7z"/><path d="M692 103l12 7-12 7z"/><path d="M692 235l12 7-12 7z"/></g><text x="1070" y="186" fill="#AAB7D0" font-family="Arial,sans-serif" font-size="12" transform="rotate(90 1070 186)">GET history</text></svg>
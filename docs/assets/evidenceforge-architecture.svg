<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">EvidenceForge implemented architecture</title><desc id="d">Browser workbench and API clients call the FastAPI service. Server-side bearer authentication and workspace membership scope routes. The API connects to PostgreSQL with pgvector, persisting workspaces, evidence, questionnaire versions, citations, responses, revisions, embeddings, and audit events. Hybrid grounding combines lexical and semantic retrieval with RRF. No answer-generation provider workflow is connected.</desc><rect width="1200" height="520" rx="20" fill="#0B1020"/><text x="48" y="55" fill="#E5E7EB" font-family="Arial,sans-serif" font-size="27" font-weight="700">EVIDENCEFORGE · IMPLEMENTED ARCHITECTURE</text><text x="48" y="84" fill="#AAB7D0" font-family="Arial,sans-serif" font-size="15">Read/write API foundation, evidence grounding and explicit review operations</text>
<g font-family="Arial,sans-serif"><rect x="48" y="142" width="220" height="92" rx="12" fill="#16213E" stroke="#3B82F6" stroke-width="2"/><text x="158" y="179" text-anchor="middle" fill="#E5E7EB" font-size="18" font-weight="700">Browser workbench</text><text x="158" y="207" text-anchor="middle" fill="#AAB7D0" font-size="14">Next.js · local interface</text><rect x="48" y="280" width="220" height="92" rx="12" fill="#16213E" stroke="#22D3EE" stroke-width="2"/><text x="158" y="317" text-anchor="middle" fill="#E5E7EB" font-size="18" font-weight="700">API clients</text><text x="158" y="345" text-anchor="middle" fill="#AAB7D0" font-size="14">Bearer-authenticated calls</text><rect x="410" y="195" width="300" height="138" rx="14" fill="#16213E" stroke="#22D3EE" stroke-width="3"/><text x="560" y="235" text-anchor="middle" fill="#E5E7EB" font-size="21" font-weight="700">FastAPI service</text><text x="560" y="267" text-anchor="middle" fill="#AAB7D0" font-size="14">Auth · workspace scope · validation</text><text x="560" y="293" text-anchor="middle" fill="#AAB7D0" font-size="14">import · evidence · response · review</text><text x="560" y="317" text-anchor="middle" fill="#8B5CF6" font-size="13">Grounding: lexical + semantic + RRF</text><rect x="850" y="195" width="300" height="138" rx="14" fill="#16213E" stroke="#8B5CF6" stroke-width="3"/><text x="1000" y="235" text-anchor="middle" fill="#E5E7EB" font-size="21" font-weight="700">PostgreSQL + pgvector</text><text x="1000" y="267" text-anchor="middle" fill="#AAB7D0" font-size="14">Workspace-scoped records</text><text x="1000" y="293" text-anchor="middle" fill="#AAB7D0" font-size="14">Evidence · versions · chunks</text><text x="1000" y="317" text-anchor="middle" fill="#AAB7D0" font-size="14">Questionnaires · citations · revisions</text><rect x="410" y="408" width="740" height="62" rx="10" fill="#251D3A" stroke="#8B5CF6" stroke-dasharray="8 6"/><text x="780" y="435" text-anchor="middle" fill="#E5E7EB" font-size="16" font-weight="700">Not an end-to-end answer-generation pipeline</text><text x="780" y="457" text-anchor="middle" fill="#C7B8F5" font-size="13">No connected production LLM provider / auto-submission; review is explicit user action</text></g><g fill="none" stroke="#3B82F6" stroke-width="3"><path d="M268 188H410"/><path d="M268 326H350V300H410"/><path d="M710 264H850"/></g><g fill="#22D3EE"><path d="M402 181l12 7-12 7z"/><path d="M402 293l12 7-12 7z"/><path d="M842 257l12 7-12 7z"/></g><text x="336" y="176" fill="#AAB7D0" font-family="Arial,sans-serif" font-size="12">Next rewrite*</text><text x="770" y="250" fill="#AAB7D0" font-family="Arial,sans-serif" font-size="12">SQL / vector persistence</text><text x="48" y="500" fill="#E6A93D" font-family="Arial,sans-serif" font-size="13">*Compose currently passes a different variable than the Next rewrite reads; see troubleshooting.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="330" viewBox="0 0 1050 330" role="img" aria-labelledby="t d"><title id="t">Workspace authorization decision flow</title><desc id="d">A request presents an opaque bearer token. The API hashes and validates it, resolves the active user, then checks membership for the requested workspace. A non-member or unknown workspace receives 404 Workspace not found. A member with an insufficient role receives 403. Authorized requests continue to the scoped route operation.</desc><rect width="1050" height="330" rx="18" fill="#0B1020"/><text x="40" y="46" fill="#E5E7EB" font-family="Arial,sans-serif" font-size="23" font-weight="700">WORKSPACE AUTHORIZATION · SERVER-DERIVED</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="38" y="112" width="190" height="82" rx="12" fill="#16213E" stroke="#3B82F6" stroke-width="2"/><text x="133" y="145" fill="#E5E7EB" font-size="17" font-weight="700">Bearer token</text><text x="133" y="171" fill="#AAB7D0" font-size="13">hash · expiry · revocation</text><rect x="292" y="112" width="190" height="82" rx="12" fill="#16213E" stroke="#22D3EE" stroke-width="2"/><text x="387" y="145" fill="#E5E7EB" font-size="17" font-weight="700">Resolve user</text><text x="387" y="171" fill="#AAB7D0" font-size="13">active identity</text><rect x="546" y="112" width="205" height="82" rx="12" fill="#16213E" stroke="#8B5CF6" stroke-width="2"/><text x="648" y="145" fill="#E5E7EB" font-size="17" font-weight="700">Check membership</text><text x="648" y="171" fill="#D7CCFA" font-size="13">server-side workspace + role</text><rect x="815" y="72" width="200" height="70" rx="12" fill="#123B38" stroke="#22C55E" stroke-width="2"/><text x="915" y="102" fill="#E5E7EB" font-size="16" font-weight="700">Allowed role</text><text x="915" y="125" fill="#C3F2D4" font-size="13">run scoped operation</text><rect x="815" y="174" width="200" height="70" rx="12" fill="#321C26" stroke="#EF4444" stroke-width="2"/><text x="915" y="204" fill="#E5E7EB" font-size="16" font-weight="700">Deny safely</text><text x="915" y="227" fill="#F5B7C4" font-size="13">404 nonmember / 403 role</text></g><g stroke="#3B82F6" stroke-width="3"><path d="M228 153h64M482 153h64M751 153h35M648 194v56h167M482 153h76v132h257"/></g><g fill="#3B82F6"><path d="M283 146l12 7-12 7z"/><path d="M537 146l12 7-12 7z"/><path d="M778 146l12 7-12 7z"/></g><text x="40" y="293" fill="#AAB7D0" font-family="Arial,sans-serif" font-size="14">Workspace and role are derived from persisted membership—not accepted as client authority.</text></svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="EvidenceForge logo">
  <title>EvidenceForge logo</title>
  <desc>Shield emblem containing an evidence document with provenance trace lines and a verification check, in the EvidenceForge navy/blue/cyan palette.</desc>
  <!-- Shield body: deep navy fill, restrained blue ring for edge definition on any background -->
  <path d="M120 10 L208 42 V120 Q208 188 120 230 Q32 188 32 120 V42 Z"
        fill="#0B1020" stroke="#3B82F6" stroke-width="6" stroke-linejoin="round"/>
  <!-- Evidence document -->
  <rect x="84" y="66" width="72" height="108" rx="8" ry="8"
        fill="none" stroke="#E5E7EB" stroke-width="6"/>
  <!-- Folded corner -->
  <path d="M140 66 L156 82 L140 82 Z" fill="none" stroke="#E5E7EB" stroke-width="6" stroke-linejoin="round"/>
  <!-- Provenance trace lines with origin nodes -->
  <circle cx="99" cy="102" r="4" fill="#22D3EE"/>
  <path d="M110 102 H146" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  <circle cx="99" cy="122" r="4" fill="#22D3EE"/>
  <path d="M110 122 H146" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  <circle cx="99" cy="142" r="4" fill="#22D3EE"/>
  <path d="M110 142 H146" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  <!-- Verification check badge overlapping the document corner -->
  <circle cx="164" cy="162" r="21" fill="#3B82F6" stroke="#0B1020" stroke-width="5"/>
  <path d="M155 162 l6 7 l12 -14" fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evidenceforge}
      POSTGRES_USER: ${POSTGRES_USER:-evidenceforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${EF_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 180s

  web:
    build:
      context: ./frontend
    environment:
      EVIDENCEFORGE_API_URL: ${EVIDENCEFORGE_API_URL:-http://api:8000}
    ports:
      - "${EF_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/backend-api/health/ready",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
